name: action-test
on: workflow_dispatch
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: test/fixtures/malicious-skill
          fail-on: high
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skill-scan.sarif
