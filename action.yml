name: skill-scan
description: Scan agent skills and MCP configuration for prompt injection, secret exfiltration and dangerous shell commands. Writes SARIF.
branding:
  icon: shield
  color: purple
inputs:
  path:
    description: Folder, file or .zip to scan, relative to the repository root.
    default: '.'
  fail-on:
    description: 'Fail the step when a finding is at least this severe: low, medium, high, critical or none.'
    default: high
  sarif-file:
    description: Where to write the SARIF report.
    default: skill-scan.sarif
  config:
    description: Optional path to a skill-scan config file.
    default: ''
  baseline:
    description: Optional path to a baseline file. Findings recorded in it do not fail the step.
    default: ''
  summary:
    description: Write the findings as a table to the job summary ("true" or "false").
    default: 'true'
runs:
  using: composite
  steps:
    - name: Build skill-scan
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
    - name: Scan
      shell: bash
      # Inputs are passed through the environment, never pasted into the script.
      env:
        SKILL_SCAN_PATH: ${{ inputs.path }}
        SKILL_SCAN_FAIL_ON: ${{ inputs.fail-on }}
        SKILL_SCAN_SARIF: ${{ inputs.sarif-file }}
        SKILL_SCAN_CONFIG: ${{ inputs.config }}
        SKILL_SCAN_BASELINE: ${{ inputs.baseline }}
        SKILL_SCAN_SUMMARY: ${{ inputs.summary }}
      run: |
        common=()
        if [ -n "$SKILL_SCAN_CONFIG" ]; then common+=(--config "$SKILL_SCAN_CONFIG"); fi
        if [ -n "$SKILL_SCAN_BASELINE" ]; then common+=(--baseline "$SKILL_SCAN_BASELINE"); fi
        cli="$GITHUB_ACTION_PATH/dist/src/cli.js"
        if [ "$SKILL_SCAN_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          node "$cli" --format markdown --fail-on none ${common[@]+"${common[@]}"} -- "$SKILL_SCAN_PATH" >> "$GITHUB_STEP_SUMMARY"
        fi
        node "$cli" --format sarif --output "$SKILL_SCAN_SARIF" --fail-on "$SKILL_SCAN_FAIL_ON" ${common[@]+"${common[@]}"} -- "$SKILL_SCAN_PATH"
